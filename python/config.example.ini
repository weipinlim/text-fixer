; TextFixer (Python) settings. The first run copies this file to config.ini.
; Same format as the AutoHotkey version, plus a [Server] section for the local model.
; Comments must be on their own line.

[Settings]
; local  = the model on this PC (see [Server] below); TextFixer runs the API itself
; openai = any OpenAI-compatible server (vLLM, llama.cpp, LM Studio, ChatGPT...): set API_URL
; gemini = Google Gemini (API_KEY)   ollama = a local Ollama
PROVIDER=local

; Leave empty for local, gemini and ollama
API_URL=
API_KEY=

; Model name sent to the server (for local it is just a label)
MODEL=local

TEMPERATURE=0.2
; Seconds to wait for an answer (the NPU can be slow on long texts)
TIMEOUT=120
SELECTION_WAIT_MS=300

; Apps (process names, comma-separated) where the hotkeys always act as normal shortcuts
EXCLUDE_APPS=EXCEL.EXE

; Ctrl+Left click runs the default tone (the number of the [PresetN] below)
DEFAULT_PRESET=1
DEFAULT_HOTKEY=^LButton
; Ctrl+Shift+Space: popup at the cursor (describe a change or click a tone)
POPUP_HOTKEY=^+Space
; Ctrl+Right click: menu of tones
MENU_HOTKEY=^RButton
; Ctrl+Shift+Left click: every tone's answer in tabs; Ctrl+Shift+Right click: as a list
PREVIEW_HOTKEY=^+LButton
RESULTS_MENU_HOTKEY=^+RButton
; Ctrl+Middle click: explain the selected word in a tooltip
EXPLAIN_HOTKEY=^MButton
EXPLAIN_SECONDS=30
;EXPLAIN_PROMPT=Explain the selected word simply, with one example sentence.
; Ctrl+Alt+Space: chat window
CHAT_HOTKEY=^!Space
; Hotkey syntax: ^ Ctrl, ! Alt, + Shift, # Win, then a key or LButton/RButton/MButton.
; Leave a hotkey empty to turn it off.

[Server]
; Folder with the OpenVINO model (see README: download or convert one)
MODEL_DIR=models/model
MODEL_NAME=local
; Devices to try, in order. The first one that loads the model is used.
DEVICE=NPU,GPU,CPU
HOST=127.0.0.1
PORT=8000
; If set, clients (including this app) must send it as a Bearer token
API_KEY=
; NPU: the compiled model has fixed sizes. Longest prompt and room for the answer, in tokens
MAX_PROMPT_LEN=2048
MIN_RESPONSE_LEN=256
MAX_NEW_TOKENS=1024
; Compiled-model cache (makes later NPU starts much faster)
CACHE_DIR=.ov_cache

; ---------------------------------------------------------------------------
; Tone presets: [Preset1] .. [Preset9], each with NAME, HOTKEY and PROMPT.
; MODE=window shows the answer in a result window (Markdown, follow-up questions)
; instead of replacing your text. Use \n for a line break inside a PROMPT.
; ---------------------------------------------------------------------------

[Preset1]
NAME=Casual
HOTKEY=^1
PROMPT=Rewrite the user's text in a relaxed, casual, conversational tone, like a message to a colleague you know well. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.

[Preset2]
NAME=Professional
HOTKEY=^2
PROMPT=Rewrite the user's text in a clear, polite, professional business tone suitable for work email. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.

[Preset3]
NAME=Sarcastic
HOTKEY=^3
PROMPT=Rewrite the user's text with a dry, witty, sarcastic tone. Keep it playful rather than offensive, and keep the original meaning recognisable. Fix any grammar or spelling mistakes. Keep the language. Return only the rewritten text.

[Preset4]
NAME=Diplomatic
HOTKEY=^4
PROMPT=Rewrite the user's text in a tactful, diplomatic tone. Soften blunt or negative wording, stay respectful and constructive, but keep the message clear. Fix any grammar or spelling mistakes. Keep the language. Return only the rewritten text.

[Preset5]
NAME=Confident
HOTKEY=^5
PROMPT=Rewrite the user's text in a confident, direct, assertive tone. Remove hedging and filler such as "just", "I think", "sorry to bother" and "maybe", while staying polite. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.

[Preset6]
NAME=Summary
HOTKEY=^6
MODE=window
PROMPT=You summarize the text the user gives you. Write a succinct summary that still covers all the key points. Use Markdown (bold, short lists) to make it easy to read. Do not be repetitive or verbose. Respond in the same language as the text. Return only the summary.

[Preset7]
NAME=Key Points
HOTKEY=^7
MODE=window
PROMPT=You extract the key points from the text the user gives you. Return them as a Markdown list, using bold for the important terms. Do not be repetitive or verbose. Respond in the same language as the text. Return only the list.

[Preset8]
NAME=Table
HOTKEY=^8
MODE=window
PROMPT=You convert the text the user gives you into a Markdown table with sensible columns. Respond in the same language as the text. Return only the table.
