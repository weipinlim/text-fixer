; TextFixer settings
; Copy this file to config.ini (same folder as TextFixer.ahk / TextFixer.exe)
; and fill in your real values. config.ini is git-ignored, so your key stays local.
; Comments must be on their own line (no comments after a value).

[Settings]
; OpenAI-compatible chat completions endpoint of your vLLM server
API_URL=http://YOUR_SERVER:8000/v1/chat/completions

; Leave empty if your vLLM server was started without --api-key
API_KEY=YOUR_API_KEY_HERE

; Model name as served by vLLM (see http://YOUR_SERVER:8000/v1/models)
MODEL=YOUR_MODEL_NAME

TEMPERATURE=0.2

; Seconds to wait for the server to answer
TIMEOUT=60

; How long (ms) to wait for the selection to be copied. If nothing is copied
; in this time, the hotkey is passed through to the app as a normal shortcut.
; Raise it if a slow app sometimes gets the shortcut instead of the fix.
SELECTION_WAIT_MS=300

; Apps (process names, comma-separated) where the hotkeys always act as normal
; shortcuts. Excel is here because Ctrl+C copies the active cell even with no
; text selected, which would otherwise hijack Ctrl+1 (Format Cells).
EXCLUDE_APPS=EXCEL.EXE

; Ctrl+Left click runs the default tone. Pick it here (1-5, the number of the
; [PresetN] below) or from the tray icon -> Default tone. Default: 1 (Casual).
DEFAULT_PRESET=1
DEFAULT_HOTKEY=^LButton

; Ctrl+Right click on selected text pops up a menu of all your tones at the
; cursor; click one to run it. Leave empty (MENU_HOTKEY=) to turn it off.
MENU_HOTKEY=^RButton

; Ctrl+Shift+Left click runs ALL tones at once on the selected text and shows
; the results in a box at the top of the screen, one tab per tone. Click a tab
; (or press 1-9) to read it, then "Use this" (or Enter) to replace your
; selection. Leave empty (PREVIEW_HOTKEY=) to turn it off.
PREVIEW_HOTKEY=^+LButton

; Ctrl+Shift+Right click also runs ALL tones at once, but shows the results as a
; menu at the cursor (first part of each result, one per row). Click one to use
; it. Leave empty (RESULTS_MENU_HOTKEY=) to turn it off.
RESULTS_MENU_HOTKEY=^+RButton

; ---------------------------------------------------------------------------
; Tone presets: [Preset1] .. [Preset9], each with NAME, HOTKEY and PROMPT.
; Hotkeys only run when text is selected; otherwise the key/click goes to the app.
; Hotkey syntax: ^ = Ctrl, ! = Alt, + = Shift, # = Win, LButton = left click.
;   ^LButton = Ctrl+Left click   ^1 = Ctrl+1   ^!1 = Ctrl+Alt+1
; Leave HOTKEY empty (HOTKEY=) if a tone should only be used as the default.
; Use \n for a line break inside a PROMPT.
; ---------------------------------------------------------------------------

[Preset1]
NAME=Casual
HOTKEY=^1
PROMPT=Rewrite the user's text in a relaxed, casual, conversational tone, like a message to a colleague you know well. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.

[Preset2]
NAME=Professional
HOTKEY=^2
PROMPT=Rewrite the user's text in a clear, polite, professional business tone suitable for work email. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.

[Preset3]
NAME=Sarcastic
HOTKEY=^3
PROMPT=Rewrite the user's text with a dry, witty, sarcastic tone. Keep it playful rather than offensive, and keep the original meaning recognisable. Fix any grammar or spelling mistakes. Keep the language. Return only the rewritten text.

[Preset4]
NAME=Diplomatic
HOTKEY=^4
PROMPT=Rewrite the user's text in a tactful, diplomatic tone. Soften blunt or negative wording, stay respectful and constructive, but keep the message clear. Fix any grammar or spelling mistakes. Keep the language. Return only the rewritten text.

[Preset5]
NAME=Confident
HOTKEY=^5
PROMPT=Rewrite the user's text in a confident, direct, assertive tone. Remove hedging and filler such as "just", "I think", "sorry to bother" and "maybe", while staying polite. Fix any grammar or spelling mistakes. Keep the meaning and language. Return only the rewritten text.
