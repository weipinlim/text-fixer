; TextFixer settings
; Copy this file to config.ini (same folder as TextFixer.ahk / TextFixer.exe)
; and fill in your real values. config.ini is git-ignored, so your key stays local.
; Comments must be on their own line (no comments after a value).

[Settings]
; OpenAI-compatible chat completions endpoint of your vLLM server
API_URL=http://YOUR_SERVER:8000/v1/chat/completions

; Leave empty if your vLLM server was started without --api-key
API_KEY=YOUR_API_KEY_HERE

; Model name as served by vLLM (see http://YOUR_SERVER:8000/v1/models)
MODEL=YOUR_MODEL_NAME

TEMPERATURE=0.2

; Seconds to wait for the server to answer
TIMEOUT=60

; How long (ms) to wait for the selection to be copied. If nothing is copied
; in this time, the hotkey is passed through to the app as a normal shortcut.
; Raise it if a slow app sometimes gets the shortcut instead of the fix.
SELECTION_WAIT_MS=300

; Apps (process names, comma-separated) where the hotkeys always act as normal
; shortcuts. Excel is here because Ctrl+C copies the active cell even with no
; text selected, which would otherwise hijack Ctrl+1 (Format Cells).
EXCLUDE_APPS=EXCEL.EXE

; Default prompt for any preset without its own PROMPT
SYSTEM_PROMPT=You are a proofreader. Fix spelling, grammar and punctuation in the user's text. Keep the original meaning, tone, formatting and language. Return only the corrected text, with no explanations or quotes.

; ---------------------------------------------------------------------------
; Presets: [Preset1] .. [Preset9]. Each needs a HOTKEY; NAME and PROMPT are optional.
; Hotkeys only run when text is selected; otherwise the key goes to the app.
; Hotkey syntax: ^ = Ctrl, ! = Alt, + = Shift, # = Win.
;   ^1  = Ctrl+1      ^!1 = Ctrl+Alt+1 (to switch back to the old style)
; Use \n for a line break inside a PROMPT. Replace the example prompts with your own.
; ---------------------------------------------------------------------------

[Preset1]
NAME=Fix grammar
HOTKEY=^1
PROMPT=You are a proofreader. Fix spelling, grammar and punctuation in the user's text. Keep the original meaning, tone, formatting and language. Return only the corrected text, with no explanations or quotes.

[Preset2]
NAME=Professional
HOTKEY=^2
PROMPT=Rewrite the user's text in a clear, polite, professional business tone. Keep the meaning and language. Return only the rewritten text.

[Preset3]
NAME=Friendly
HOTKEY=^3
PROMPT=Rewrite the user's text in a warm, friendly, casual tone. Keep the meaning and language. Return only the rewritten text.

[Preset4]
NAME=Shorten
HOTKEY=^4
PROMPT=Make the user's text shorter and more concise without losing important information. Keep the language. Return only the shortened text.

[Preset5]
NAME=Translate to English
HOTKEY=^5
PROMPT=Translate the user's text into natural, correct English. Return only the translation.
