# Builds TextFixer-Setup.exe (Python app + Ollama + model download) on Windows.
# Runs on pushes that change the Python app, on demand (Actions tab > Windows installer >
# Run workflow), and for tags like v1.0.0 (then the installer is attached to a GitHub release).
name: Windows installer

on:
  push:
    paths:
      - "python/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels a build that is still running
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install pynput  # only for the tests; the Windows build itself sends keys with SendInput

      # PyInstaller's ready-made loader is also used by a lot of malware, so antivirus scanners
      # often flag it. Compiling our own copy from source avoids matching that signature.
      - name: Install PyInstaller with a freshly compiled loader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller "pyinstaller==6.22.3"

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Build the app
        run: |
          pip uninstall -y pynput  # make sure the build cannot pick it up
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0" }
          $parts = ($v -split "[^0-9]+" | Where-Object { $_ -ne "" } | Select-Object -First 3) + @("0", "0", "0")
          $four = ($parts[0..2] + "0") -join "."
          $tuple = ($parts[0..2] + "0") -join ", "
          (Get-Content installer/version_info.txt) -replace "0\.1\.0\.0", $four -replace "\(0, 1, 0, 0\)", "($tuple)" |
            Set-Content installer/version_info.txt
          pyinstaller --noconfirm --clean textfixer.spec

      - name: Check the packaged app starts
        run: |
          Copy-Item config.example.ini dist\TextFixer\
          dist\TextFixer\TextFixerCLI.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\TextFixer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TextFixer-Setup
          path: python/dist/installer/TextFixer-Setup.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/installer/TextFixer-Setup.exe
