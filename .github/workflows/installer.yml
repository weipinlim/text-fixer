# Builds TextFixer-Setup.exe (Python app + Ollama + model download) on Windows.
# Runs on pushes that change the Python app, on demand, and for tags like v1.0.0
# (then the installer is attached to a GitHub release).
name: Windows installer

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/installer.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Build the app
        run: pyinstaller --noconfirm --clean textfixer.spec

      - name: Check the packaged app starts
        run: |
          Copy-Item config.example.ini dist\TextFixer\
          dist\TextFixer\TextFixerCLI.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\TextFixer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TextFixer-Setup
          path: python/dist/installer/TextFixer-Setup.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/installer/TextFixer-Setup.exe
